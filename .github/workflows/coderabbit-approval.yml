name: CodeRabbit approval verification

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_run:
    workflows: [Review events]
    types: [completed]
  check_run:
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: coderabbit-approval
  cancel-in-progress: false

jobs:
  verify:
    name: Verify CodeRabbit evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Require current-head CodeRabbit approval and successful content review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-coderabbit-approval.mjs --publish
