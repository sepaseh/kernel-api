name: DAST

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Authorized staging API URL
        required: true
        type: string
concurrency:
  cancel-in-progress: false
  group: staging-dast

permissions:
  contents: read

jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    env:
      DAST_ALLOWED_HOST: ${{ vars.STAGING_ALLOWED_API_HOST }}
      DAST_PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
      DAST_TARGET: ${{ inputs.target_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Validate authorized target
        run: node scripts/validate-workflow-targets.mjs dast

      - name: Require staging-only scanner egress
        run: |
          echo "::error::DAST requires verified staging-only scanner egress before it can run."
          exit 1
