name: Bootstrap validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  governance:
    name: Bootstrap governance (API not published)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Verify the exact published governance snapshot
        run: node scripts/validate-bootstrap.mjs
      - name: Test governance and approval enforcement with measured coverage
        run: |
          node -e "require('node:fs').mkdirSync('coverage', { recursive: true })"
          node --experimental-test-coverage --test --test-reporter=spec --test-reporter=lcov --test-reporter-destination=stdout --test-reporter-destination=coverage/lcov.info scripts/check-pr-size.test.mjs scripts/check-review-approvals.test.mjs scripts/publish-review-approval.test.mjs scripts/validate-bootstrap.test.mjs
      - name: First-PR file count (unprivileged PR code)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-pr-size.mjs
