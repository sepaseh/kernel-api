name: API staging verification
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Explicit authorized HTTPS API origin
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: api-staging
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: staging
    env:
      API_DEPLOYMENT_URL: ${{ inputs.api_url }}
      API_ALLOWED_HOST: ${{ vars.STAGING_ALLOWED_API_HOST }}
      PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
      EXPECTED_DEPLOYMENT_ID: ${{ vars.EXPECTED_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-deployed-api.mjs staging
