name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install validation dependencies
        run: npm ci --strict-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npm run validate -- ci-quality
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install validation dependencies
        run: npm ci --strict-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npm run validate -- ci-audit
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.evidence.outputs.artifact }}
      attempt: ${{ steps.evidence.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install validation dependencies
        run: npm ci --strict-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npm run validate -- ci-unit
      - name: Bind measured coverage to this run and source
        id: evidence
        env:
          CI_EVIDENCE_SUITE: unit
        run: node scripts/ci-evidence.mjs --record
      - name: Share measured coverage with analysis
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.evidence.outputs.artifact }}
          path: |
            coverage/unit/lcov.info
            coverage/unit/ci-evidence.json
            coverage/unit/v8/
          if-no-files-found: error
          retention-days: 3
          overwrite: false
          include-hidden-files: false
  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.evidence.outputs.artifact }}
      attempt: ${{ steps.evidence.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install validation dependencies
        run: npm ci --strict-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npm run validate -- ci-integration
      - name: Bind measured coverage to this run and source
        id: evidence
        env:
          CI_EVIDENCE_SUITE: integration
        run: node scripts/ci-evidence.mjs --record
      - name: Share measured coverage with analysis
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.evidence.outputs.artifact }}
          path: |
            coverage/integration/lcov.info
            coverage/integration/ci-evidence.json
            coverage/integration/v8/
          if-no-files-found: error
          retention-days: 3
          overwrite: false
          include-hidden-files: false
  governance:
    name: Governance tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.evidence.outputs.artifact }}
      attempt: ${{ steps.evidence.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install validation dependencies
        run: npm ci --strict-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npm run validate -- ci-governance
      - name: Bind measured coverage to this run and source
        id: evidence
        env:
          CI_EVIDENCE_SUITE: governance
        run: node scripts/ci-evidence.mjs --record
      - name: Share measured coverage with analysis
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.evidence.outputs.artifact }}
          path: |
            coverage/governance/lcov.info
            coverage/governance/ci-evidence.json
            coverage/governance/v8/
            coverage/governance/audit-lcov.info
            coverage/governance/audit-v8/
          if-no-files-found: error
          retention-days: 3
          overwrite: false
          include-hidden-files: false
  check:
    permissions:
      contents: read
    needs:
      - quality
      - audit
      - unit
      - integration
      - governance
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.evidence.outputs.artifact }}
      attempt: ${{ steps.evidence.outputs.attempt }}
    steps:
      - name: Require every validation job to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node -e "const needs = JSON.parse(process.env.CI_NEEDS); if (!['quality', 'audit', 'unit', 'integration', 'governance'].every(job => needs[job]?.result === 'success')) process.exit(1)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Download measured unit coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.unit.outputs.artifact }}
          path: coverage/unit
          digest-mismatch: error
      - name: Verify unit coverage provenance and contents
        env:
          CI_EVIDENCE_SUITE: unit
          CI_EVIDENCE_PRODUCER_ATTEMPT: ${{ needs.unit.outputs.attempt }}
        run: node scripts/ci-evidence.mjs --verify-coverage
      - name: Download measured integration coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.integration.outputs.artifact }}
          path: coverage/integration
          digest-mismatch: error
      - name: Verify integration coverage provenance and contents
        env:
          CI_EVIDENCE_SUITE: integration
          CI_EVIDENCE_PRODUCER_ATTEMPT: ${{ needs.integration.outputs.attempt }}
        run: node scripts/ci-evidence.mjs --verify-coverage
      - name: Download measured governance coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.governance.outputs.artifact }}
          path: coverage/governance
          digest-mismatch: error
      - name: Verify governance coverage provenance and contents
        env:
          CI_EVIDENCE_SUITE: governance
          CI_EVIDENCE_PRODUCER_ATTEMPT: ${{ needs.governance.outputs.attempt }}
        run: node scripts/ci-evidence.mjs --verify-coverage
      - name: Enforce combined measured coverage without rerunning tests
        run: npm run check:coverage
      - name: Bind combined coverage to its verified producers
        id: evidence
        env:
          CI_EVIDENCE_SUITE: combined
        run: node scripts/ci-evidence.mjs --record
      - name: Share measured combined coverage with analysis
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.evidence.outputs.artifact }}
          path: |
            coverage/lcov.info
            coverage/combined/ci-evidence.json
          if-no-files-found: error
          retention-days: 3
          overwrite: false
          include-hidden-files: false
  analysis:
    name: SonarQube Cloud analysis
    needs:
      - check
    if: needs.check.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require configured SonarQube Cloud analysis
        env:
          SONAR_TOKEN_CONFIGURED: ${{ secrets.SONAR_TOKEN != '' }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [[ "$SONAR_TOKEN_CONFIGURED" != 'true' || -z "$SONAR_PROJECT_KEY" ]]; then
            echo '::error::Configure SONAR_TOKEN and SONAR_PROJECT_KEY before analysis. No Sonar analysis was performed.'
            exit 1
          fi
      - name: Download this run's measured coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.check.outputs.artifact }}
          path: coverage
          digest-mismatch: error
      - name: Verify coverage provenance and contents
        env:
          CI_EVIDENCE_SUITE: combined
          CI_EVIDENCE_PRODUCER_ATTEMPT: ${{ needs.check.outputs.attempt }}
        run: node scripts/ci-evidence.mjs --verify-coverage
      - name: Install analysis dependencies without running package scripts
        run: npm ci --strict-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Analyze published source and measured coverage
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} -Dsonar.scm.revision=${{ github.event.pull_request.head.sha || github.sha }}
