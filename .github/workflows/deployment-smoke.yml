name: API smoke verification
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Explicit authorized HTTPS API origin
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: api-smoke
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: smoke
    env:
      API_DEPLOYMENT_URL: ${{ inputs.api_url }}
      API_ALLOWED_HOST: ${{ vars.SMOKE_ALLOWED_API_HOST }}
      PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
      EXPECTED_DEPLOYMENT_ID: ${{ vars.EXPECTED_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-deployed-api.mjs smoke
