sonar.organization=sepaseh
sonar.sources=src,scripts
sonar.tests=src,scripts
sonar.test.inclusions=src/**/*.test.ts,scripts/*.test.mjs
sonar.exclusions=src/**/*.test.ts,scripts/*.test.mjs
# Only the ten literal language catalogs omit duplication detection; keep all rule and coverage analysis.
sonar.cpd.exclusions=src/infrastructure/localization/catalogs/ar.ts,src/infrastructure/localization/catalogs/de.ts,src/infrastructure/localization/catalogs/en.ts,src/infrastructure/localization/catalogs/es.ts,src/infrastructure/localization/catalogs/fa.ts,src/infrastructure/localization/catalogs/fr.ts,src/infrastructure/localization/catalogs/it.ts,src/infrastructure/localization/catalogs/pt.ts,src/infrastructure/localization/catalogs/ru.ts,src/infrastructure/localization/catalogs/tr.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.qualitygate.wait=false
