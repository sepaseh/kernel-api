# Local development MinIO helper only; production is deploy/docker/compose.yaml.
name: kernel-api-development
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - kernel-api-minio:/data
volumes:
  kernel-api-minio:
